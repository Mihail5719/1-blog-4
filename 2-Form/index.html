<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма регистрации</title>
    <link rel="stylesheet" href="./styles/style.css" />
</head>
<body>
    <main>
    <div class="layout">
        <div class="container">
        <div class="registration-title">Регистрация</div>
        <div class="subtitle">
            <span class="subtitle-text">Уже есть аккаунт?</span>
            <a href="#" class="login-link">Войти</a>
        </div>
        <div class="username-block">
            <label for="company-input" class="username-label">Моя компания</label>
            <input type="text" id="company-input" class="username-input" placeholder="">
        </div>
        <div class="name-block">
            <div class="input-group">
                <input type="text" class="name-input" placeholder="Имя">
            </div>
            <div class="divider"></div>
            <div class="input-group">
                <input type="text" class="name-input" placeholder="Фамилия">
            </div>
        </div>
            <div class="email-block">
                <input type="email" class="email-input" placeholder="E-mail">
            </div>
            
            <button class="signup-btn">
                <span class="btn-text">Зарегистрироваться</span>
                <img src="./images/arrow 1.svg" alt="" class="btn-arrow" />
            </button>
            <div class="terms-block">
                <img src=" ./images/restangle 5.svg" alt="" class="terms-svg">
                <span class="terms-accept">Я прочитал и принимаю</span>
                <a href="#" class="terms-link">Условия использования</a>
            </div>
          </div>
        </div>
    </main>
</body>
</html>
